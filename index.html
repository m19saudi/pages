<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <title>Pages الصفحات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Tahoma, sans-serif;

            background: #f3f1ec;
            color: #24332f;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #132723;
            color: white;

            padding: 32px 20px;

            text-align: center;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        header h1 {
            margin: 0;

            font-size: 25px;
            font-weight: 600;
        }


        /* =========================
           CONTENT
        ========================= */

        main {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }


        /* =========================
           BUTTON GRID
        ========================= */

        .sites {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));

            gap: 18px;
        }


        /* =========================
           SITE BUTTON
        ========================= */

        .site {
            min-height: 85px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #ffffff;

            border: 1px solid #e2dfd8;
            border-radius: 14px;

            color: #24332f;

            text-decoration: none;

            font-size: 18px;
            font-weight: 600;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s ease,
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* Hover */

        .site:hover {
            background: #bda16a;

            color: #ffffff;

            border-color: #bda16a;

            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);
        }


        /* Click / press */

        .site:active {
            transform: translateY(-1px) scale(0.98);

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.08);
        }


        /* Keyboard accessibility */

        .site:focus-visible {
            outline: 3px solid #bda16a;
            outline-offset: 3px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 25px 15px;
            }

            header h1 {
                font-size: 21px;
            }

            main {
                margin: 30px auto;
                padding: 0 15px;
            }

            .sites {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .site {
                min-height: 70px;
                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <header>
        <h1>Sites المواقع</h1>
    </header>


    <main>

        <div class="sites" id="sites"></div>

    </main>


    <script>

        // =================================================
        // ADD YOUR SITES HERE
        //
        // [ "اسم الموقع", "رابط الموقع" ]
        // =================================================

        const sites = [
          
            ["دليل العمرة", "https://m19saudi.github.io/umrah/"],
            ["الحرمين", "https://m19saudi.github.io/haramain/"],
            ["وصلة", "https://waslah-one.vercel.app/"],
            ["abc", "https://m19saudi.github.io/abc/"],
            ["الكتب", "https://example.com"],
            ["جديد", "https://example.com"]

        ];


        // =================================================
        // DO NOT EDIT BELOW
        // =================================================

        const container = document.getElementById("sites");

        sites.forEach(([name, url]) => {

            const button = document.createElement("a");

            button.className = "site";

            button.href = url;

            button.target = "_blank";

            button.rel = "noopener noreferrer";

            button.textContent = name;

            container.appendChild(button);

        });

    </script>

</body>

</html>
